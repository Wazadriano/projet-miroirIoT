# Services locaux du device (PostgreSQL + API mock + IA mock + Adminer).
# Les ports ne sont publies que sur la boucle locale de la machine hote. Pour les
# exposer a une VM ou au reseau local, definir BIND_ADDRESS=0.0.0.0 dans .env.
# POSTGRES_PASSWORD est obligatoire (voir .env.example) : aucune valeur par defaut.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartmirror
      POSTGRES_USER: smartmirror
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./mock-api/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmirror"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-api:
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8100:8100"
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartmirror
      DB_USER: smartmirror
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      MOCK_API_PORT: 8100
      MOCK_IA_PORT: 3001
      # Dans le conteneur, les serveurs doivent ecouter sur toutes les interfaces
      # pour etre atteignables via le port publie ; l'exposition reelle est bornee
      # par BIND_ADDRESS ci-dessus.
      MOCK_API_HOST: 0.0.0.0
      MOCK_IA_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
